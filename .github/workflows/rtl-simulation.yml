name: Asynchronous FIFO portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOSAIC_FLOW_REVISION: 0bd222f827afd802944d5f7e6ebc2ccc3a96f7ea

jobs:
  profiles:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      formal-matrix: ${{ steps.matrix.outputs.formal }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate pinned dependencies and parameter matrix
        id: matrix
        run: |
          test "$(git -C mosaic-flow rev-parse HEAD)" = "${MOSAIC_FLOW_REVISION}"
          test "$(git -C submodules/mosaic-common rev-parse HEAD)" = "$(git rev-parse HEAD:submodules/mosaic-common)"
          make profile-manifest-check
          first="$(make --silent profile-matrix)"
          second="$(make --silent profile-matrix)"
          test "${first}" = "${second}"
          echo "value=${first}" >> "${GITHUB_OUTPUT}"
          make PARAMETER_PROFILE_MANIFEST=config/formal-profiles.json profile-manifest-check
          formal="$(make --silent PARAMETER_PROFILE_MANIFEST=config/formal-profiles.json profile-matrix)"
          echo "formal=${formal}" >> "${GITHUB_OUTPUT}"

  formal:
    name: Formal / ${{ matrix.profile }}
    needs: profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.profiles.outputs.formal-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mosaic
          key: mosaic-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mosaic-flow/VERSION', 'mosaic-flow/config/tool-versions.env', 'mosaic-flow/config/pyuvm-requirements.txt') }}
      - name: Prove exact profile and check reachability evidence
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          test "$(git -C mosaic-flow rev-parse HEAD)" = "${MOSAIC_FLOW_REVISION}"
          test "$(git -C submodules/mosaic-common rev-parse HEAD)" = "$(git rev-parse HEAD:submodules/mosaic-common)"
          make PARAMETER_PROFILE_MANIFEST=config/formal-profiles.json \
            PROFILE="${PROFILE}" REPORT_DIR="${PWD}/reports/formal" \
            WORK_DIR="${PWD}/work/formal" open-formal
          python3 .github/scripts/check-formal-evidence.py --profile "${PROFILE}" \
            --reports "reports/formal/${PROFILE}" --work "work/formal/${PROFILE}"
      - name: Check formal evidence failure controls
        if: matrix.profile == 'delayed_reset_depth2'
        run: |
          python3 .github/scripts/test-formal-evidence.py --profile delayed_reset_depth2 \
            --reports reports/formal/delayed_reset_depth2 --work work/formal/delayed_reset_depth2
      - name: Verify source cleanliness
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -z "$(git -C mosaic-flow status --porcelain)"
          test -z "$(git -C submodules/mosaic-common status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: async-fifo-formal-${{ matrix.profile }}
          path: |
            reports/formal/${{ matrix.profile }}/
            work/formal/${{ matrix.profile }}/symbiyosys_formal/
            work/formal/${{ matrix.profile }}/symbiyosys_coverage/
          if-no-files-found: error

  native:
    name: Native / ${{ matrix.profile }}
    needs: profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.profiles.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: ~/.cache/mosaic
          key: mosaic-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mosaic-flow/VERSION', 'mosaic-flow/config/tool-versions.env', 'mosaic-flow/config/pyuvm-requirements.txt') }}
      - name: Verify dependency identities
        run: |
          test "$(git -C mosaic-flow rev-parse HEAD)" = "${MOSAIC_FLOW_REVISION}"
          test "$(git -C submodules/mosaic-common rev-parse HEAD)" = "$(git rev-parse HEAD:submodules/mosaic-common)"
      - name: Run portable profile
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "reports/${PROFILE}"
          make PROFILE="${PROFILE}" flow-config-check | tee "reports/${PROFILE}/flow-policy.log"
          make PROFILE="${PROFILE}" open-source
          python3 .github/scripts/check-cross-coverage.py "reports/${PROFILE}/verilator_sim"
          ./.github/scripts/check-pyuvm-evidence.sh "reports/${PROFILE}/pyuvm_open_source"
      - name: Check expanded assertion failure controls
        if: matrix.profile == 'minimum'
        run: |
          python3 .github/scripts/test-cross-coverage.py reports/minimum/verilator_sim
          bash .github/scripts/check-assertion-controls.sh
      - name: Verify source cleanliness
        run: |
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -z "$(git -C mosaic-flow status --porcelain)"
          test -z "$(git -C submodules/mosaic-common status --porcelain)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: async-fifo-native-${{ matrix.profile }}
          path: reports/
          if-no-files-found: error

  container:
    name: Container / all profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build pinned portable environment
        run: |
          test "$(git -C mosaic-flow rev-parse HEAD)" = "${MOSAIC_FLOW_REVISION}"
          test "$(git -C submodules/mosaic-common rev-parse HEAD)" = "$(git rev-parse HEAD:submodules/mosaic-common)"
          docker build --build-context mosaic-flow=./mosaic-flow \
            --build-arg MOSAIC_FLOW_REVISION="${MOSAIC_FLOW_REVISION}" \
            -t mosaic-async-fifo:portable .
      - name: Run profiles in the container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" mosaic-async-fifo:portable \
            all-profiles PROFILE_JOBS=2 PROFILE_TARGET=open-source \
            REPORT_DIR=/workspace/reports/container WORK_DIR=/workspace/work/container
          while IFS= read -r profile; do
            python3 .github/scripts/check-cross-coverage.py "reports/container/${profile}/verilator_sim"
            ./.github/scripts/check-pyuvm-evidence.sh "reports/container/${profile}/pyuvm_open_source"
          done < <(make --silent profile-list)
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint bash \
            -e REPORT_DIR=/workspace/reports/container \
            -e WORK_DIR=/workspace/work/container \
            -v "${GITHUB_WORKSPACE}:/workspace" mosaic-async-fifo:portable \
            .github/scripts/check-assertion-controls.sh
      - name: Run the formal matrix in the container
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" mosaic-async-fifo:portable \
            PARAMETER_PROFILE_MANIFEST=config/formal-profiles.json \
            all-profiles PROFILE_JOBS=2 PROFILE_TARGET=open-formal \
            REPORT_DIR=/workspace/reports/formal-container \
            WORK_DIR=/workspace/work/formal-container
          while IFS= read -r profile; do
            python3 .github/scripts/check-formal-evidence.py --profile "${profile}" \
              --reports "reports/formal-container/${profile}" \
              --work "work/formal-container/${profile}"
          done < <(make --silent PARAMETER_PROFILE_MANIFEST=config/formal-profiles.json profile-list)
          python3 .github/scripts/test-formal-evidence.py --profile delayed_reset_depth2 \
            --reports reports/formal-container/delayed_reset_depth2 \
            --work work/formal-container/delayed_reset_depth2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: async-fifo-container
          path: |
            reports/
            work/formal-container/
          if-no-files-found: error
